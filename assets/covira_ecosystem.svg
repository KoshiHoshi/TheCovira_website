<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
  <style>
    .bg { fill: transparent; }
    .edge { stroke: #CC1B1B; fill: none; stroke-linecap: round; opacity: 0.52; }
    .e1 { stroke-width: 1.0; opacity: 0.48; }
    .e2 { stroke-width: 0.6; opacity: 0.34; }
    .e3 { stroke-width: 0.35; opacity: 0.24; }
    .nd { fill: #CC1B1B; }
    .ring { fill: none; stroke: #CC1B1B; }

    /* pulse animations for each node tier */
    @keyframes nodePulse {
      0%, 100% { opacity: 0.85; r: 6; }
      50% { opacity: 1; r: 8; }
    }
    @keyframes nodePulseSm {
      0%, 100% { opacity: 0.55; r: 4; }
      50% { opacity: 0.9; r: 5.5; }
    }
    @keyframes nodePulseXs {
      0%, 100% { opacity: 0.28; r: 2.5; }
      50% { opacity: 0.5; r: 3.5; }
    }
    @keyframes corePulse {
      0%, 100% { r: 7; opacity: 0.85; }
      50% { r: 10; opacity: 1; }
    }
    @keyframes ringExpand1 {
      0%, 100% { r: 60; opacity: 0.22; }
      50% { r: 68; opacity: 0.10; }
    }
    @keyframes ringExpand2 {
      0%, 100% { r: 110; opacity: 0.16; }
      50% { r: 118; opacity: 0.07; }
    }
    @keyframes ringExpand3 {
      0%, 100% { r: 168; opacity: 0.13; }
      50% { r: 176; opacity: 0.06; }
    }
    @keyframes ringExpand4 {
      0%, 100% { r: 230; opacity: 0.09; }
      50% { r: 238; opacity: 0.04; }
    }
    @keyframes ringExpand5 {
      0%, 100% { r: 300; opacity: 0.06; }
      50% { r: 308; opacity: 0.03; }
    }

    /* edge draw-in via stroke-dashoffset */
    @keyframes drawEdge {
      to { stroke-dashoffset: 0; }
    }
    .draw { animation: drawEdge 1.8s cubic-bezier(0.4,0,0.2,1) forwards; }

    /* data flow pulse along edges */
    @keyframes flowDot {
      0% { opacity: 0; offset-distance: 0%; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; offset-distance: 100%; }
    }
    .flow-dot {
      fill: #CC1B1B;
      r: 2.5;
      animation: flowDot 3s ease-in-out infinite;
    }

    /* breathe for rings */
    .r1 { animation: ringExpand1 4s ease-in-out infinite; }
    .r2 { animation: ringExpand2 5s ease-in-out infinite 0.5s; }
    .r3 { animation: ringExpand3 6s ease-in-out infinite 1s; }
    .r4 { animation: ringExpand4 7s ease-in-out infinite 1.5s; }
    .r5 { animation: ringExpand5 8s ease-in-out infinite 2s; }

    /* node pulse staggered */
    .np0 { animation: nodePulse 3.0s ease-in-out infinite 0.0s; }
    .np1 { animation: nodePulse 3.2s ease-in-out infinite 0.3s; }
    .np2 { animation: nodePulse 2.8s ease-in-out infinite 0.6s; }
    .np3 { animation: nodePulse 3.4s ease-in-out infinite 0.9s; }
    .np4 { animation: nodePulse 3.1s ease-in-out infinite 1.2s; }
    .np5 { animation: nodePulse 2.9s ease-in-out infinite 1.5s; }
    .np6 { animation: nodePulse 3.3s ease-in-out infinite 1.8s; }
    .np7 { animation: nodePulse 3.0s ease-in-out infinite 2.1s; }
    .np8 { animation: nodePulse 3.2s ease-in-out infinite 0.4s; }

    .npsm0 { animation: nodePulseSm 3.5s ease-in-out infinite 0.2s; }
    .npsm1 { animation: nodePulseSm 3.0s ease-in-out infinite 0.7s; }
    .npsm2 { animation: nodePulseSm 3.8s ease-in-out infinite 1.0s; }
    .npsm3 { animation: nodePulseSm 3.2s ease-in-out infinite 1.3s; }
    .npsm4 { animation: nodePulseSm 3.6s ease-in-out infinite 1.6s; }
    .npsm5 { animation: nodePulseSm 3.1s ease-in-out infinite 1.9s; }
    .npsm6 { animation: nodePulseSm 3.4s ease-in-out infinite 0.5s; }
    .npsm7 { animation: nodePulseSm 3.7s ease-in-out infinite 0.8s; }

    .npxs0 { animation: nodePulseXs 4.0s ease-in-out infinite 0.1s; }
    .npxs1 { animation: nodePulseXs 3.8s ease-in-out infinite 0.5s; }
    .npxs2 { animation: nodePulseXs 4.2s ease-in-out infinite 0.9s; }
    .npxs3 { animation: nodePulseXs 3.6s ease-in-out infinite 1.3s; }
    .npxs4 { animation: nodePulseXs 4.4s ease-in-out infinite 1.7s; }
    .npxs5 { animation: nodePulseXs 3.9s ease-in-out infinite 2.0s; }
    .npxs6 { animation: nodePulseXs 4.1s ease-in-out infinite 2.3s; }
    .npxs7 { animation: nodePulseXs 3.7s ease-in-out infinite 0.3s; }
    .npxs8 { animation: nodePulseXs 4.3s ease-in-out infinite 0.7s; }
    .npxs9 { animation: nodePulseXs 4.0s ease-in-out infinite 1.1s; }
    .npxs10 { animation: nodePulseXs 3.8s ease-in-out infinite 1.5s; }
    .npxs11 { animation: nodePulseXs 4.2s ease-in-out infinite 1.9s; }

    .core-pulse { animation: corePulse 2.5s ease-in-out infinite; }

    /* fade in entire graphic */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .scene { animation: fadeIn 1.2s ease-out forwards; }

    /* edge fade-in stagger */
    @keyframes edgeFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .ef0 { animation: edgeFadeIn 0.8s ease-out 0.2s both; }
    .ef1 { animation: edgeFadeIn 0.8s ease-out 0.4s both; }
    .ef2 { animation: edgeFadeIn 0.8s ease-out 0.6s both; }
    .ef3 { animation: edgeFadeIn 0.8s ease-out 0.8s both; }
    .ef4 { animation: edgeFadeIn 0.8s ease-out 1.0s both; }
    .ef5 { animation: edgeFadeIn 0.8s ease-out 1.2s both; }
    .ef6 { animation: edgeFadeIn 0.8s ease-out 1.4s both; }
    .ef7 { animation: edgeFadeIn 0.8s ease-out 1.6s both; }
    .ef8 { animation: edgeFadeIn 0.8s ease-out 1.8s both; }
    .ef9 { animation: edgeFadeIn 0.8s ease-out 2.0s both; }
    .ef10 { animation: edgeFadeIn 0.8s ease-out 2.2s both; }
    .ef11 { animation: edgeFadeIn 0.8s ease-out 2.4s both; }

    /* floating travel dots on key spokes */
    @keyframes travel0 { 0%,100%{opacity:0} 10%{opacity:0.7} 90%{opacity:0.7} }
    circle.t0 { animation: travel0 4.0s linear infinite 0.0s; }
    circle.t1 { animation: travel0 4.2s linear infinite 0.8s; }
    circle.t2 { animation: travel0 3.8s linear infinite 1.6s; }
    circle.t3 { animation: travel0 4.4s linear infinite 2.4s; }
    circle.t4 { animation: travel0 3.6s linear infinite 3.2s; }
    circle.t5 { animation: travel0 4.1s linear infinite 0.4s; }
    circle.t6 { animation: travel0 3.9s linear infinite 1.2s; }
    circle.t7 { animation: travel0 4.3s linear infinite 2.0s; }

    .r1 { animation-duration: 12s; }
    .r2 { animation-duration: 14s; }
    .r3 { animation-duration: 16s; }
    .r4 { animation-duration: 18s; }
    .r5 { animation-duration: 20s; }

    .np0, .np3, .np6 { animation-duration: 8.8s; }
    .np1, .np4, .np7 { animation-duration: 9.6s; }
    .np2, .np5, .np8 { animation-duration: 10.4s; }
    .npsm0, .npsm2, .npsm4 { animation-duration: 9.4s; }
    .npsm1, .npsm3, .npsm5 { animation-duration: 10.8s; }
    .npxs0, .npxs3, .npxs6, .npxs9 { animation-duration: 11.2s; }
    .npxs1, .npxs4, .npxs7, .npxs10 { animation-duration: 12.4s; }
    .npxs2, .npxs5, .npxs8, .npxs11 { animation-duration: 13.2s; }
    .core-pulse { animation-duration: 7.8s; }
    .t0, .t3, .t6 { animation-duration: 10s; }
    .t1, .t4, .t7 { animation-duration: 11.5s; }
    .t2, .t5 { animation-duration: 12.5s; }

    @media (prefers-reduced-motion: reduce) {
      .scene,
      .scene * {
        animation: none !important;
      }
    }
  </style>

  <!-- travel motion paths for animated dots -->
  <path id="p_spoke0" d="M600,400 L765,160" fill="none"/>
  <path id="p_spoke1" d="M600,400 L850,402" fill="none"/>
  <path id="p_spoke2" d="M600,400 L762,630" fill="none"/>
  <path id="p_spoke3" d="M600,400 L438,632" fill="none"/>
  <path id="p_spoke4" d="M600,400 L350,400" fill="none"/>
  <path id="p_spoke5" d="M600,400 L440,162" fill="none"/>
  <path id="p_spoke6" d="M600,400 L600,108" fill="none"/>
  <path id="p_spoke7" d="M600,400 L600,692" fill="none"/>
</defs>

